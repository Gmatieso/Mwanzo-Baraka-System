# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

env:
  SPRING_PROFILES_ACTIVE: prod

on:
  push:
    branches: [ "main" ]
permissions:
  contents: write
  security-events: write

jobs:
  build:

    runs-on: [self-hosted, gcp]

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package -DskipTests --file pom.xml

    - name: ✅ Build Complete
      run: echo "Build finished successfully."

    - name: Create .env file 
            run: |
        echo "DATABASE_USER=${{ secrets.DB_USER }}" >> .env
        echo "DATABASE_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
        echo "DATABASE_URL=jdbc:postgresql://postgres-db:5432/mwanzo" >> .env
        echo "FLYWAY_ENABLED=true" >> .env
        echo "POSTGRES_DB=mwanzo" >> .env
        
    - name: Verify .env keys
      run: cut -d '=' -f1 .env
        
    - name: Run Docker Compose
      run: docker compose --env-file .env up -d --build

    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
      with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
