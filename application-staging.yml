spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mwanzo_staging}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:mwanzo_staging123}

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public
    baseline-on-migrate: true
    out-of-order: true
    validate-on-migrate: true
    user: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:mwanzo_staging123}
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mwanzo_staging}

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none

springdoc:
  api-docs:
    path: "/apidocs-staging"

logging:
  level:
    org.flywaydb: INFO
    org.springframework: INFO
